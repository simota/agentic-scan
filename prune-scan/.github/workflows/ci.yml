name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
            pdf: true
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests and repository checks
        run: make check
      - name: Render and verify English and Japanese PDFs
        if: matrix.pdf
        env:
          CHROME: google-chrome
        run: |
          for lang in en ja; do
            make demo LANG_OUT="$lang" DEMO_OUT="$RUNNER_TEMP/prune-scan-demo-$lang"
          done
