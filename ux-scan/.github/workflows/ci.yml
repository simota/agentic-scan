name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate scripts, references and sample contracts
        run: make check

  pdf:
    name: PDF reports (English and Japanese)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Render and validate both PDF reports
        env:
          UX_SCAN_PDF_TIMEOUT: "120"
        run: |
          export CHROME="$(command -v google-chrome)"
          make demo LANG_OUT=en DEMO_OUT="${{ runner.temp }}/ux-scan-demo-en"
          make demo LANG_OUT=ja DEMO_OUT="${{ runner.temp }}/ux-scan-demo-ja"
      - name: Upload sample reports for inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-scan-sample-reports
          path: |
            ${{ runner.temp }}/ux-scan-demo-en/
            ${{ runner.temp }}/ux-scan-demo-ja/
          if-no-files-found: warn
          retention-days: 7
